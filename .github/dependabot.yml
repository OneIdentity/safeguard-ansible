# Dependabot configuration for safeguard-ansible.
#
# Ecosystems covered:
#   * pip             -- Python dependencies for the collection tests and the
#                        credential_type_plugin (requirements.txt / pyproject.toml).
#   * github-actions  -- workflow file dependencies (CodeQL, etc.).
#
# The Ansible Galaxy collection (galaxy.yml) has no Dependabot ecosystem and
# is not tracked here.
#
# Major-version bumps are excluded; they require human review.
#
# GitHub Private Vulnerability Disclosure (PVD) is enabled in the repository's
# Security tab; that toggle is not file-driven.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/collection/tests"
      - "/credential_type_plugin"
      - "/credential_type_plugin/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      python-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-and-minor:
        update-types:
          - "patch"
          - "minor"